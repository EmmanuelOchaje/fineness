[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
# v4 uses transient storage (EIP-1153) for its unlock/callback accounting.
evm_version = "cancun"
via_ir = false

[profile.fork]
# Fork tests against live Arc mainnet state. Run: forge test --profile fork
eth_rpc_url = "${ARC_RPC_URL}"
# Arc has no tracing RPCs (debug_traceCall / trace_call both return -32014),
# so verbose test output and contract events are the only debugging surface.
verbosity = 3

[profile.ci]
fuzz = { runs = 1000 }
verbosity = 2

[rpc_endpoints]
arc = "${ARC_RPC_URL}"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
